name: Check GNU Info manual
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install documentation tools
        run: sudo apt-get update && sudo apt-get install -y texinfo info
      - name: Rebuild the committed Texinfo
        run: make -B all
      - name: Check content and navigation
        run: make check selftest
      - name: Check a staged installation
        run: make install INFODIR="$RUNNER_TEMP/missing-semester-info" && info -d "$RUNNER_TEMP/missing-semester-info" missing-semester-2026 Git -o /dev/null
